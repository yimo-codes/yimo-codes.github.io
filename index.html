<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>yimo · 个人名片</title>
  <style>
    :root {
      --bg-top: #0b1322;
      --bg-bottom: #070c15;
      --ink: #f4f7fc;
      --muted: rgba(226, 235, 248, 0.62);
      --gold: #d8b573;
      --gold-soft: #eddbb8;
      --line: rgba(216, 181, 115, 0.24);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 4vw, 40px);
      color: var(--ink);
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      background:
        /* 中心微微提亮，四周沉下去，让卡片“浮”在光里 */
        radial-gradient(720px 520px at 50% 46%, rgba(104, 140, 198, 0.13), transparent 60%),
        radial-gradient(820px 560px at 12% -12%, rgba(216, 181, 115, 0.07), transparent 60%),
        linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    }

    .card {
      position: relative;
      width: min(100%, 460px);
      padding: clamp(28px, 4.4vw, 34px) clamp(24px, 5vw, 38px);
      text-align: center;
      border-radius: var(--radius);
      border: 1px solid rgba(255, 255, 255, 0.09);
      /* 半透明底 + 毛玻璃：背景的光会被柔化后透上来 */
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.012));
      -webkit-backdrop-filter: blur(18px) saturate(130%);
      backdrop-filter: blur(18px) saturate(130%);
      box-shadow:
        0 26px 48px -30px rgba(0, 0, 0, 0.75),
        inset 0 1px 0 rgba(255, 255, 255, 0.07);
      overflow: hidden;
      animation: rise 0.6s ease-out both;
    }

    /* 顶部一道细细的金色光，作为视觉记忆点 */
    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 52%;
      height: 1px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      box-shadow: 0 0 12px rgba(216, 181, 115, 0.28);
    }

    .avatar {
      width: 108px;
      height: 108px;
      margin: 0 auto 20px;
      border-radius: 50%;
      overflow: hidden;
      /* 细金线，和副标题同色系 */
      border: 1px solid rgba(237, 219, 184, 0.38);
      box-shadow:
        0 10px 22px -14px rgba(0, 0, 0, 0.9),
        0 0 0 5px rgba(216, 181, 115, 0.04);
    }

    .avatar-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .name {
      margin: 0;
      font-size: clamp(32px, 7.5vw, 38px);
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1.15;
      color: var(--ink);
    }

    .role {
      margin: 8px 0 0;
      font-size: 12.5px;
      letter-spacing: 0.16em;
      color: var(--gold-soft);
      opacity: 0.88;
    }

    .divider {
      width: 26px;
      height: 1px;
      margin: 15px auto 14px;
      border: 0;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .intro {
      max-width: 22em;
      margin: 0 auto;
      font-size: 15px;
      line-height: 1.62;
      color: var(--muted);
      text-wrap: balance;
    }

    .contact {
      display: flex;
      justify-content: center;
      margin-top: 22px;
    }

    .mail {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      font-size: 14px;
      letter-spacing: 0.02em;
      color: var(--gold-soft);
      text-decoration: none;
      cursor: pointer;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(216, 181, 115, 0.04);
      transition:
        background-color 0.18s ease,
        border-color 0.18s ease,
        color 0.18s ease,
        transform 0.18s ease,
        box-shadow 0.18s ease;
    }

    .mail svg {
      display: block;   /* 去掉 inline 元素的基线空隙，图标和文字才能真正居中 */
      width: 15px;
      height: 15px;
      flex: 0 0 auto;
    }

    .mail:hover {
      background: rgba(216, 181, 115, 0.14);
      border-color: rgba(216, 181, 115, 0.7);
      color: #fff6e4;
      transform: translateY(-2px);
      box-shadow: 0 10px 22px -12px rgba(216, 181, 115, 0.55);
    }

    .mail:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .mail:focus-visible {
      outline: 2px solid rgba(216, 181, 115, 0.65);
      outline-offset: 3px;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }

    @media (max-width: 400px) {
      .avatar { width: 96px; height: 96px; }
      .intro { font-size: 14px; }
      .mail { padding: 10px 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
      .mail { transition: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">
      <img class="avatar-img" src="avatar.jpg" alt="yimo 的头像" width="512" height="512" />
    </div>

    <h1 class="name">yimo</h1>
    <p class="role">前端初学者 · 阅读爱好者</p>

    <hr class="divider" />

    <p class="intro">
      僮生愆尤，未着一相。
    </p>

    <div class="contact">
      <a class="mail" href="mailto:223344@tz.com">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="3" />
          <path d="m4.5 7.5 6.4 5.1a1.8 1.8 0 0 0 2.2 0l6.4-5.1" />
        </svg>
        223344@tz.com
      </a>
    </div>
  </main>
</body>
</html>
